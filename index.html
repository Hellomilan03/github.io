<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milan Greenman</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: Arial, sans-serif;
        background: url('images/main.jpg') center center / cover no-repeat fixed;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        text-align: center;
        padding: 20px;
    }

    h1 {
        margin-bottom: 10px;
        font-size: 2.5rem;
        line-height: 1.2;
    }

    .subtitle {
        margin-bottom: 30px;
        font-size: 1rem;
        color: rgba(255,255,255,0.85);
        letter-spacing: 0.02em;
    }

    .icon-row {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 40px;
        flex-wrap: wrap;
    }

    .icon-link {
        text-decoration: none;
        color: white;
    }

    .icon-link img {
        width: 90px;
        height: 90px;
        transition: transform 0.3s ease;
        display: block;
    }

    .icon-link:hover img {
        transform: scale(1.15);
    }

    .icon-label {
        margin-top: 8px;
        color: white;
        font-size: 14px;
    }

    .github-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .small-icon img {
        width: 70px;
        height: 70px;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Milan Greenman</h1>
    <div class="subtitle">@hellomilan03</div>

    <div class="icon-row">

        <!-- YouTube -->
        <a class="icon-link"
           href="https://www.youtube.com/@hellomilan03/featured"
           target="_blank"
           rel="noopener noreferrer">
            <img src="images/youtube.png" alt="YouTube">
            <div class="icon-label">YouTube</div>
        </a>

        <!-- Facebook -->
        <a class="icon-link"
           href="https://www.facebook.com/hellomilan03"
           target="_blank"
           rel="noopener noreferrer">
            <img src="images/facebook.png" alt="Facebook">
            <div class="icon-label">Facebook</div>
        </a>

        <!-- GitHub + Projects -->
        <div class="github-column">

            <a class="icon-link"
               href="https://github.com/Hellomilan03"
               target="_blank"
               rel="noopener noreferrer">
                <img src="images/github.png" alt="Github">
                <div class="icon-label">GitHub</div>
            </a>

            <a class="icon-link small-icon"
               href="https://hellomilan03.github.io/HP15C-style-HTML-Calculator-Milan-Greenman/"
               target="_blank"
               rel="noopener noreferrer">
                <img src="images/calc.png" alt="Calc">
                <div class="icon-label">MG-15C</div>
            </a>

            <a class="icon-link small-icon"
               href="https://hellomilan03.github.io/Pong/"
               target="_blank"
               rel="noopener noreferrer">
                <img src="images/pong.png" alt="Pong">
                <div class="icon-label">Pong</div>
            </a>

        </div>

        <!-- Printables -->
        <a class="icon-link"
           href="https://www.printables.com/@TheGreenmanS_1381837"
           target="_blank"
           rel="noopener noreferrer">
            <img src="images/printables.png" alt="Printables">
            <div class="icon-label">Printables</div>
        </a>

    </div>
</div>

</body>
</html>
