<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Milan</title>

    <!-- Font Awesome Icons -->
    https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #121212;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-link {
            width: 100px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 15px;
            background: #222;
            text-decoration: none;
            color: white;

            transition: 0.3s;
        }

        .social-link:hover {
            transform: translateY(-5px);
            background: #333;
        }

        .social-link i {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .youtube {
            color: #ff0000;
        }

        .facebook {
            color: #1877f2;
        }

        .github {
            color: #ffffff;
        }

        .printables {
            color: #f58220;
            font-size: 2rem;
            font-weight: bold;
        }

        .label {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Hello Milan</h1>

    <div class="links">

        <a class="social-link"
           href="https://www.youtube.com/@hellomilan03/featured"
           target="_blank"
           rel="noopener noreferrer">
            <i class="fab fa-youtube youtube"></i>
            <span class="label">YouTube</span>
        </a>

        <a class="social-link"
           href="https://www.facebook.com/hellomilan03"
           target="_blank"
           rel="noopener noreferrer">
            <i class="fab fa-facebook facebook"></i>
            <span class="label">Facebook</span>
        </a>

        <a class="social-link"
           href="https://github.com/Hellomilan03"
           target="_blank"
           rel="noopener noreferrer">
            <i class="fab fa-github github"></i>
            <span class="label">GitHub</span>
        </a>

        <a class="social-link"
           href="https://www.printables.com/@TheGreenmanS_1381837"
           target="_blank"
           rel="noopener noreferrer">
            <span class="printables">P</span>
            <span class="label">Printables</span>
        </a>

    </div>

</div>

</body>
</html>
