<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Milan</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        text-align: center;
    }

    h1 {
        margin-bottom: 30px;
        font-size: 2.5rem;
    }

    .icon-row {
        display: flex;
        justify-content: center;
        gap: 40px;
        flex-wrap: wrap;
    }

    .icon-link img {
        width: 90px;
        height: 90px;
        transition: transform 0.3s ease;
    }

    .icon-link:hover img {
        transform: scale(1.15);
    }

    .icon-label {
        margin-top: 8px;
        color: white;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Hello Milan</h1>

    <div class="icon-row">

        <a class="icon-link"
           href="https://www.youtube.com/@hellomilan03/featured"
           target="_blank">
            <img src="images/youtube.png" alt="YouTube">
            <div class="icon-label">YouTube</div>
        </a>

        <a class="icon-link"
           href="https://www.facebook.com/hellomilan03"
           target="_blank">
            <img src="images/facebook.png" alt="Facebook">
            <div class="icon-label">Facebook</div>
        </a>

        <a class="icon-link"
           href="https://github.com/Hellomilan03"
           target="_blank">
            <img src="images/github.png" alt="GitHub">
            <div class="icon-label">GitHub</div>
        </a>

        <a class="icon-link"
           href="https://www.printables.com/@TheGreenmanS_1381837"
           target="_blank">
            <img src="images/printables.png" alt="Printables">
            <div class="icon-label">Printables</div>
        </a>

    </div>
</div>

</body>
</html>
